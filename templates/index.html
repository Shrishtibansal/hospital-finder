<!DOCTYPE html>
<html>
<head>
    <title>Emergency Hospital Finder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1a1a1a;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            border-radius: 12px;
            color: white;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 24px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 150px;
            padding: 12px 14px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .search-box input:focus {
            border-color: #d32f2f;
        }

        .search-box button {
            padding: 12px 22px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background-color: #b71c1c;
        }

        .hospital-card {
            background: white;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .hospital-card input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .hospital-info {
            flex: 1;
        }

        .hospital-info h3 {
            font-size: 17px;
            margin-bottom: 6px;
            color: #1a1a1a;
        }

        .badge-emergency {
            display: inline-block;
            background-color: #ffebee;
            color: #c62828;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .hospital-address {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .hospital-meta {
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
        }

        .hospital-meta span {
            display: inline-block;
            margin-right: 16px;
        }

        .btn-small {
            padding: 7px 14px;
            background-color: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-small:hover {
            background-color: #e0e0e0;
        }

        .btn-remove {
            background-color: #ffebee;
            color: #c62828;
        }

        .btn-remove:hover {
            background-color: #ffcdd2;
        }

        #compareBtn {
            display: none;
            margin-bottom: 20px;
            padding: 12px 22px;
            background-color: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        #compareBtn:hover {
            background-color: #333;
        }

        .section-title {
            font-size: 20px;
            margin: 30px 0 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        table th {
            background-color: #1a1a1a;
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 13px;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .empty-message {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Emergency Hospital Finder</h1>
            <p>Find real hospitals near you, sorted by distance</p>
        </header>

        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name">
            <input type="text" id="specialty" placeholder="Specialty (optional, e.g. eye, children)">
            <button onclick="findHospitals()">Use My Location & Search</button>
        </div>

        <div id="results"></div>

        <button id="compareBtn" onclick="compareSelected()">Compare Selected</button>
        <div id="compareResults"></div>

        <h2 class="section-title">📌 My Saved Hospitals</h2>
        <div id="bookmarksList"></div>
    </div>

    <script>
        let currentHospitals = [];

        function findHospitals() {
            const city = document.getElementById("city").value;
            const specialty = document.getElementById("specialty").value;

            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                fetch("/find-hospitals", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ latitude: lat, longitude: lon, city: city, specialty: specialty })
                })
                .then(response => response.json())
                .then(data => {
                    currentHospitals = data;
                    let html = "";
                    if (data.length === 0) {
                        html = "<div class='empty-message'>No hospitals found. Please check the city name and try again.</div>";
                        document.getElementById("compareBtn").style.display = "none";
                    } else {
                        data.forEach((hospital, index) => {
                            let emergencyBadge = "";
                            if (hospital.emergency === "yes") {
                                emergencyBadge = "<span class='badge-emergency'>EMERGENCY READY</span>";
                            }
                            html += `<div class="hospital-card">
                                        <input type="checkbox" class="compareCheck" value="${index}">
                                        <div class="hospital-info">
                                            <h3>${hospital.name}${emergencyBadge}</h3>
                                            <div class="hospital-address">${hospital.address}</div>
                                            <div class="hospital-meta">
                                                <span>📍 ${hospital.distance_km} km</span>
                                                <span>📞 ${hospital.phone}</span>
                                            </div>
                                            <button class="btn-small" onclick="saveBookmark(${index})">Bookmark This</button>
                                        </div>
                                    </div>`;
                        });
                        document.getElementById("compareBtn").style.display = "inline-block";
                    }
                    document.getElementById("results").innerHTML = html;
                    document.getElementById("compareResults").innerHTML = "";
                });
            });
        }

        function compareSelected() {
            const checkboxes = document.querySelectorAll(".compareCheck:checked");

            if (checkboxes.length < 2) {
                alert("Please select at least 2 hospitals to compare.");
                return;
            }
            if (checkboxes.length > 3) {
                alert("Please select a maximum of 3 hospitals.");
                return;
            }

            let tableHtml = "<h2 class='section-title'>⚖️ Comparison</h2><table>";
            tableHtml += "<tr><th>Name</th><th>Distance</th><th>Emergency</th><th>Phone</th></tr>";

            checkboxes.forEach(checkbox => {
                const hospital = currentHospitals[checkbox.value];
                tableHtml += `<tr>
                                <td>${hospital.name}</td>
                                <td>${hospital.distance_km} km</td>
                                <td>${hospital.emergency}</td>
                                <td>${hospital.phone}</td>
                              </tr>`;
            });

            tableHtml += "</table>";
            document.getElementById("compareResults").innerHTML = tableHtml;
        }

        function saveBookmark(index) {
            const hospital = currentHospitals[index];

            fetch("/bookmarks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: hospital.name,
                    address: hospital.address,
                    distance_km: hospital.distance_km,
                    phone: hospital.phone
                })
            })
            .then(response => response.json())
            .then(data => {
                loadBookmarks();
            });
        }

        function loadBookmarks() {
            fetch("/bookmarks")
            .then(response => response.json())
            .then(data => {
                let html = "";
                if (data.length === 0) {
                    html = "<div class='empty-message'>No saved hospitals yet.</div>";
                } else {
                    data.forEach(b => {
                        html += `<div class="hospital-card">
                                    <div class="hospital-info">
                                        <h3>${b.name}</h3>
                                        <div class="hospital-address">${b.address}</div>
                                        <div class="hospital-meta">
                                            <span>📍 ${b.distance_km} km</span>
                                            <span>📞 ${b.phone}</span>
                                        </div>
                                        <button class="btn-small btn-remove" onclick="removeBookmark(${b.id})">Remove</button>
                                    </div>
                                </div>`;
                    });
                }
                document.getElementById("bookmarksList").innerHTML = html;
            });
        }

        function removeBookmark(id) {
            fetch(`/bookmarks/${id}`, { method: "DELETE" })
            .then(response => response.json())
            .then(data => {
                loadBookmarks();
            });
        }

        loadBookmarks();
    </script>
</body>
</html>
